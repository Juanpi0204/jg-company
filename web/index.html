<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JG COMPANY S.A.S — Gestión de Streaming y Finanzas">

  <!-- Mobile Viewport Fix: Permite que el teclado virtual se abra y ajuste el layout en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JG COMPANY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JG COMPANY S.A.S</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0F;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0A0F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .splash-logo {
      font-size: 26px;
      font-weight: 900;
      color: #E50914;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .splash-sub {
      font-size: 11px;
      color: #888899;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 26px;
    }
    .splash-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(229, 9, 20, 0.15);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Limpiar service workers y caches viejos para evitar pantallas blancas en actualizaciones
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          if (keys[i].indexOf('flutter') !== -1) {
            caches.delete(keys[i]);
          }
        }
      }).catch(function() {});
    }
  </script>
</head>
<body>
  <!-- Splash oscuro mientras carga el motor de Flutter (evita pantalla blanca) -->
  <div id="loading-splash">
    <div class="splash-logo">JG COMPANY</div>
    <div class="splash-sub">SISTEMA EMPRESARIAL</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // Desvanecer splash en cuanto Flutter monta la vista en el DOM
    var splashObserver = new MutationObserver(function() {
      var flt = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
      var splash = document.getElementById('loading-splash');
      if (flt && splash) {
        splashObserver.disconnect();
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 360);
      }
    });
    splashObserver.observe(document.body, { childList: true, subtree: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
